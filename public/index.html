<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bay Board</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="header">
    <h1>DEPARTURES</h1>
    <time class="clock" aria-live="polite">00:00</time>
  </header>
  <nav class="mode-tabs" role="tablist" aria-label="Transit modes" hidden>
    <button role="tab" aria-selected="true" data-mode="bart">BART</button>
    <button role="tab" aria-selected="false" data-mode="ferry">Ferry</button>
    <button role="tab" aria-selected="false" data-mode="bus">Bus</button>
  </nav>
  <main class="boards">
    <section class="board" data-mode="bart" aria-label="BART departures">
      <div class="board-header">
        <svg class="pictogram" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 17h16M4 17v-3a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3M7 17v-3a2 2 0 0 1 4 0v3M17 17v-3"/></svg>
        <span class="stop-name">FRUITVALE</span>
        <span class="updated" aria-live="polite">UPDATED --:--</span>
        <span class="badge stale" hidden>STALE</span>
      </div>
      <table class="departures">
        <thead>
          <tr>
            <th scope="col">LINE</th>
            <th scope="col">DESTINATION</th>
            <th scope="col">MIN</th>
            <th scope="col">PLATFORM</th>
          </tr>
        </thead>
        <tbody>
          <tr class="loading-row"><td colspan="4">Loading…</td></tr>
        </tbody>
      </table>
    </section>
    <section class="board" data-mode="ferry" aria-label="Ferry departures" hidden>
      <div class="board-header">
        <svg class="pictogram" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 18h16M6 18V8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v10"/></svg>
        <span class="stop-name">—</span>
        <span class="updated" aria-live="polite">UPDATED --:--</span>
        <span class="badge stale" hidden>STALE</span>
      </div>
      <table class="departures">
        <thead>
          <tr>
            <th scope="col">LINE</th>
            <th scope="col">DESTINATION</th>
            <th scope="col">MIN</th>
            <th scope="col">REMARKS</th>
          </tr>
        </thead>
        <tbody>
          <tr class="loading-row"><td colspan="4">COMING SOON</td></tr>
        </tbody>
      </table>
    </section>
    <section class="board" data-mode="bus" aria-label="Bus departures" hidden>
      <div class="board-header">
        <svg class="pictogram" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 17h16M4 17v-5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v5M8 17v-5M16 17v-5"/></svg>
        <span class="stop-name">—</span>
        <span class="updated" aria-live="polite">UPDATED --:--</span>
        <span class="badge stale" hidden>STALE</span>
      </div>
      <table class="departures">
        <thead>
          <tr>
            <th scope="col">LINE</th>
            <th scope="col">DESTINATION</th>
            <th scope="col">MIN</th>
            <th scope="col">REMARKS</th>
          </tr>
        </thead>
        <tbody>
          <tr class="loading-row"><td colspan="4">COMING SOON</td></tr>
        </tbody>
      </table>
    </section>
  </main>
  <script type="module" src="/split-flap.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
