name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: No dependencies allowed
        run: node -e "const p=require('./package.json'); const d={...p.dependencies,...p.devDependencies}; if(Object.keys(d).length){console.error('Dependencies found:',d); process.exit(1)}"
      - run: npm test
